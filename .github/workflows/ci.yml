# Tests en cada push y despliegue al staging del VPS.
#
# - tests: en un runner de GitHub, con la imagen oficial de Odoo 19 y PostgreSQL.
# - desplegar: al staging del VPS, por SSH con una clave cuyo único comando posible es el script de
#   despliegue del repo de infra (ffunes-cru/servidor, privado). Solo con push a master o a mano desde
#   Actions → CI/CD → Run workflow (cualquier branch). Ver docs/despliegue.md.
name: CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: odoo:19.0
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: addons/posventa

      - name: Instalar Chrome y websocket-client (sin ellos, los tests de navegador se saltean)
        run: |
          # Espejo de Ubuntu en Azure (el que usan los runners de GitHub): archive.ubuntu.com a veces no resuelve
          sed -i -e 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|' \
                 -e 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|' /etc/apt/sources.list.d/ubuntu.sources
          apt-get -o Acquire::Retries=3 update -qq
          curl -fsSL --retry 3 -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          apt-get install -y -qq /tmp/chrome.deb python3-websocket
          chown -R odoo "$GITHUB_WORKSPACE"

      - name: Instalar posventa y correr sus tests
        run: |
          runuser -u odoo -- odoo --addons-path="$GITHUB_WORKSPACE/addons" \
            --db_host=db --db_user=odoo --db_password=odoo -d posventa_ci \
            -i posventa --test-tags=/posventa --stop-after-init --log-level=test

  desplegar:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: desplegar-staging
      cancel-in-progress: false
    steps:
      # La clave solo puede ejecutar scripts/desplegar.sh del repo de infra (comando forzado en authorized_keys)
      - name: Desplegar en staging por SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          DESTINO: ${{ vars.STAGING_SSH_DESTINO }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_staging && chmod 600 ~/.ssh/id_staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_staging -o BatchMode=yes "$DESTINO" "posventa $GITHUB_SHA"
