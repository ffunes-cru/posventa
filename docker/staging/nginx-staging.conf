# Staging de Odoo (stack ~/odoo-staging). Va en ~/mi-servidor/nginx/staging.conf.
# La redirección de HTTP a HTTPS y el desafío de certbot los resuelve el bloque "listen 80" de default.conf.
server {
    listen 443 ssl;
    server_name staging.portalcrucianelli.site;

    ssl_certificate /etc/letsencrypt/live/staging.portalcrucianelli.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.portalcrucianelli.site/privkey.pem;

    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Un solo proceso de Odoo (workers = 0): HTTP y websocket van al mismo puerto
    location / {
        set $odoo_staging odoo-staging:8069;
        proxy_pass http://$odoo_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
