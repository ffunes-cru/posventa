; Odoo de staging: una sola base, sin selector ni administrador de bases.
; Va en ~/odoo-staging/config/odoo.conf.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_name = staging
dbfilter = ^staging$
list_db = False
proxy_mode = True
; Generar con: openssl rand -base64 24
admin_passwd = CAMBIAR
